<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Link Downloader</title>
<style>
  :root {
    --bg: #E8EDF1;
    --ink: #101820;
    --muted: #556473;
    --line: #C3CED8;
    --card: #FFFFFF;
    --accent: #0B5FFF;
    --accent-ink: #FFFFFF;
    --error: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1620;
      --ink: #E9EFF5;
      --muted: #93A3B3;
      --line: #263444;
      --card: #162230;
      --accent: #5B8DFF;
      --accent-ink: #0E1620;
      --error: #FF8A80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12vh 20px 40px;
  }
  main { width: 100%; max-width: 640px; }
  h1 {
    font-size: clamp(2.2rem, 7vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    font-weight: 800;
    margin: 0 0 14px;
  }
  .sub { color: var(--muted); margin: 0 0 32px; max-width: 46ch; }

  .field {
    display: flex;
    gap: 10px;
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 8px;
  }
  .field:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  input[type="url"] {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 1.05rem;
    padding: 10px 12px;
  }
  input[type="url"]:focus { outline: none; }
  button, select { font: inherit; }
  .btn {
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    border-radius: 9px;
    padding: 10px 20px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .btn:disabled { opacity: 0.6; cursor: wait; }

  .error { color: var(--error); font-weight: 600; margin: 14px 4px 0; min-height: 1.5em; }

  .result {
    display: none;
    margin-top: 22px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .result.show { display: block; }
  .thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: var(--line); display: block; }
  .meta { padding: 18px 20px 20px; }
  .title { font-weight: 700; font-size: 1.1rem; margin: 0 0 4px; overflow-wrap: anywhere; }
  .dur { color: var(--muted); margin: 0 0 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  select {
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 12px;
  }
  .note { color: var(--muted); font-size: 0.9rem; margin: 12px 0 0; min-height: 1.3em; }

  footer { color: var(--muted); font-size: 0.85rem; max-width: 640px; width: 100%; margin-top: 48px; }

  @media (max-width: 480px) {
    .field { flex-direction: column; }
    .btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>Paste a video link.<br>Get the file.</h1>
  <p class="sub">Works with direct video links and most video sites. Choose a quality and download.</p>

  <div class="field">
    <input id="url" type="url" placeholder="https://example.com/video" aria-label="Video link" autocomplete="off">
    <button id="find" class="btn">Find video</button>
  </div>
  <div id="error" class="error" role="alert"></div>

  <section id="result" class="result" aria-live="polite">
    <img id="thumb" class="thumb" alt="">
    <div class="meta">
      <p id="title" class="title"></p>
      <p id="dur" class="dur"></p>
      <div class="row">
        <select id="quality" aria-label="Quality"></select>
        <button id="dl" class="btn">Download</button>
      </div>
      <p id="note" class="note"></p>
    </div>
  </section>
</main>

<footer>
  Download only videos you own or have permission to save. Many sites' terms don't allow downloads,
  and you are responsible for how you use this tool.
</footer>

<script>
  const $ = (id) => document.getElementById(id);
  let currentUrl = "";

  function fmtDuration(s) {
    if (!s) return "";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    const mm = String(m).padStart(h ? 2 : 1, "0"), ss = String(sec).padStart(2, "0");
    return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  }

  async function findVideo() {
    const url = $("url").value.trim();
    $("error").textContent = "";
    $("result").classList.remove("show");
    if (!url) { $("error").textContent = "Paste a video link first."; return; }

    $("find").disabled = true;
    $("find").textContent = "Searching…";
    try {
      const res = await fetch("/api/info", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      });
      const data = await res.json();
      if (!res.ok) { $("error").textContent = data.error || "Something went wrong."; return; }

      currentUrl = url;
      $("title").textContent = data.title;
      $("dur").textContent = fmtDuration(data.duration);
      if (data.thumbnail) { $("thumb").src = data.thumbnail; $("thumb").style.display = "block"; }
      else { $("thumb").style.display = "none"; }

      const q = $("quality");
      q.innerHTML = "";
      q.add(new Option("Best available", "best"));
      data.qualities.forEach((h) => q.add(new Option(h + "p", String(h))));
      q.add(new Option("Audio only", "audio"));

      $("note").textContent = "";
      $("result").classList.add("show");
    } catch (e) {
      $("error").textContent = "Can't reach the server. Try again.";
    } finally {
      $("find").disabled = false;
      $("find").textContent = "Find video";
    }
  }

  function startDownload() {
    const params = new URLSearchParams({ url: currentUrl, quality: $("quality").value });
    $("dl").disabled = true;
    $("note").textContent = "Preparing your file. The download starts when it's ready. Larger videos take longer.";
    const frame = document.createElement("iframe");
    frame.style.display = "none";
    frame.src = "/api/download?" + params.toString();
    document.body.appendChild(frame);
    setTimeout(() => { $("dl").disabled = false; frame.remove(); }, 120000);
  }

  $("find").addEventListener("click", findVideo);
  $("url").addEventListener("keydown", (e) => { if (e.key === "Enter") findVideo(); });
  $("dl").addEventListener("click", startDownload);
</script>
</body>
</html>
